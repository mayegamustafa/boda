name: razinshop_rider
description: "Total Ride - Total Health Herbalist delivery app."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dio: ^5.4.3+1
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  cupertino_icons: ^1.0.6
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  pretty_dio_logger: ^1.3.1
  flutter_screenutil: ^5.9.0
  page_transition: ^2.1.0
  go_router: ^14.6.2
  intl: ^0.20.2
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.0.0
  image_picker: ^1.1.0
  pinput: ^5.0.0
  google_maps_flutter: ^2.6.1
  url_launcher: ^6.2.6
  calendar_date_picker2: ^1.1.6
  cached_network_image: ^3.3.1
  flutter_html: ^3.0.0-beta.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_gen_runner:
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/pngs/
    - assets/svgs/

  fonts:
    - family: Mulish
      fonts:
        - asset: assets/fonts/Mulish-Regular.ttf
        - asset: assets/fonts/Mulish-Medium.ttf
        - asset: assets/fonts/Mulish-SemiBold.ttf
        - asset: assets/fonts/Mulish-Bold.ttf

flutter_intl:
  enabled: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/pngs/delivery.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/pngs/delivery.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/pngs/delivery.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/pngs/delivery.png"
